version: "3.8"

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: votinghub-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    restart: always

    networks:
      - votinghub-network

networks:

  votinghub-network:
    external: true